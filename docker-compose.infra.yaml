services:
  # PostgreSQL for development (dependency first)
  postgres:
    image: postgres:alpine
    container_name: my-project-template-db
    environment:
      POSTGRES_DB: my-project-template-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123
    ports:
      - "5432:5432"
    volumes:
      - my-project-template-db:/var/lib/postgresql/data
    healthcheck:
      # Run a healthcheck, which our app will depend on before starting
      test: ["CMD-SHELL", "pg_isready -U postgres -d my-project-template-db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - my-project-template-infra-network

volumes:
  my-project-template-db:

networks:
  my-project-template-infra-network:
    name: my-project-template-infra-network
    driver: bridge
